version: '3.8'

services:
  api:
    build: .
    container_name: reliance_forecast_api
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      - MODEL_PATH=/app/models/lgbm_model.pkl
      - FEATURE_PATH=/app/models/feature_cols.pkl
    volumes:
      - ./models:/app/models

  dashboard:
    build: .
    container_name: reliance_forecast_dashboard
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - api
    volumes:
      - ./models:/app/models
      - ./metrics:/app/metrics
